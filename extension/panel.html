<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Live Tracker</title>
    <link rel="stylesheet" href="panel.css">
    <script type="module" src="panel.mjs"></script>
  </head>
  <body>
    <main>
      <h1>Web Live Tracker</h1>
      <p id="save-location">Starting capture automatically saves raw request and response bodies for this tab under web-live-tracker in Chrome downloads.</p>
      <form id="capture-form">
        <label for="research-id">Research ID</label>
        <input id="research-id" type="text" maxlength="64" autocomplete="off"
          spellcheck="false" required aria-describedby="research-id-error">
        <button id="start" type="submit" disabled aria-describedby="save-location">Start capture</button>
        <button id="stop" type="button" disabled>Stop capture</button>
        <p id="research-id-error" role="alert"></p>
      </form>
      <p id="capture-status" role="status">Capture stopped.</p>
    </main>
  </body>
</html>
