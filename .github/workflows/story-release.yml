name: Publish story release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'story/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    concurrency:
      group: story-release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false

      - name: Build browser ZIPs
        run: |
          test -n "$MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          sh scripts/package-extension.sh chrome
          sh scripts/package-extension.sh firefox

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-story-release.sh
